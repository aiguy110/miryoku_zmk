name: "Auto Build"
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  auto-build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left","corne_right", "settings_reset"]'
      alphas: '["QWERTY"]'
      nav: '["vi"]'
      layers: '["default"]'
      mapping: '["default"]'
      custom_config: '["default"]'
      kconfig: '["default"]'
      # zmk main moved to Zephyr 4 / HWMv2 (no nice_nano_v2 board); pin v0.3.
      branches: '["zmkfirmware/zmk/v0.3"]'
      modules: '["default"]'
